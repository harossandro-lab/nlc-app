<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10233B; --blue:#1E4976; --blue-deep:#123055; --blue-pale:#EAF1F8;
    --paper:#FBFAF7; --line:#C7D2DB; --line-soft:#E3E9EE;
    --orange:#E2600C; --orange-deep:#B94B08;
    --green:#2F7A4D; --green-bg:#E7F3EC;
    --amber:#B9790E; --amber-bg:#FBF0DC;
    --red:#B23A2E; --red-bg:#FBEAE6;
    --gray:#5B6B7A; --gray-bg:#F1F3F5;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  #twapp, #twapp *{font-family:'Inter',system-ui,-apple-system,sans-serif;}
  #twapp{color:var(--ink);min-height:100vh;background:var(--paper);position:relative;}
  #twapp .disp{font-family:'Oswald',Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:.04em;}
  #twapp .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

  #twapp .ruler{height:14px;background:
    repeating-linear-gradient(90deg, var(--blue-deep) 0 1px, transparent 1px 10px),
    repeating-linear-gradient(90deg, var(--blue-deep) 0 1.5px, transparent 1.5px 50px);
    background-size:10px 7px, 50px 14px; background-position:0 bottom, 0 top; background-repeat:repeat-x;
    border-bottom:1px solid var(--blue-deep); opacity:.55;}

  #twapp .topbar{background:var(--ink); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  #twapp .topbar .brand{display:flex; align-items:baseline; gap:10px;}
  #twapp .topbar .brand .tag{font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:.14em; color:var(--orange); border:1px solid var(--orange); padding:2px 6px; border-radius:2px;}
  #twapp .topbar .proj-edit{flex:1; min-width:220px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;}
  #twapp .topbar input.pinfo{background:transparent; border:none; border-bottom:1px dashed rgba(255,255,255,0.35); color:#fff; font-size:13px; padding:3px 2px; min-width:110px;}
  #twapp .topbar input.pinfo::placeholder{color:rgba(255,255,255,0.45);}
  #twapp .topbar input.pinfo:focus{outline:none; border-bottom:1px solid var(--orange);}
  #twapp .topbar .pinfo-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,0.5); margin-right:-3px;}
  #twapp .sync{display:flex; align-items:center; gap:6px; font-size:11px; color:rgba(255,255,255,0.7); white-space:nowrap;}
  #twapp .sync .dot{width:7px;height:7px;border-radius:50%;background:#5BD08A; box-shadow:0 0 0 3px rgba(91,208,138,0.2);}
  #twapp .sync.saving .dot{background:var(--amber); animation:pulse 1s infinite;}
  #twapp .sync.sync-error .dot{background:var(--orange); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  #twapp .shell{display:flex; align-items:flex-start;}
  #twapp .sidenav{width:200px; flex:none; background:var(--blue-pale); border-right:1px solid var(--line); min-height:calc(100vh - 62px); padding:10px 0; position:sticky; top:0; max-height:100vh; overflow-y:auto;}
  #twapp .sidenav .grp-label{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gray); padding:12px 16px 4px;}
  #twapp .navitem{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; font-size:13.5px; color:var(--ink); cursor:pointer; border-left:3px solid transparent;}
  #twapp .navitem:hover{background:rgba(30,73,118,0.07);}
  #twapp .navitem.active{background:#fff; border-left:3px solid var(--orange); font-weight:600;}
  #twapp .navitem .cnt{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--gray); background:var(--gray-bg); padding:1px 6px; border-radius:8px;}
  #twapp .navitem.active .cnt{color:var(--orange-deep); background:#FBEAE0;}

  #twapp main{flex:1; padding:22px 26px 60px; min-width:0;}
  #twapp .pagehead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; flex-wrap:wrap;}
  #twapp .pagehead h2{font-size:24px; margin:0 0 2px;}
  #twapp .pagehead .sub{font-size:12.5px; color:var(--gray);}
  #twapp .actions{display:flex; gap:8px; flex-wrap:wrap;}

  #twapp button{font-family:'Inter'; font-size:12.5px; font-weight:600; border-radius:var(--radius); cursor:pointer; padding:7px 12px; border:1px solid var(--line);}
  #twapp button.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  #twapp button.accent{background:var(--orange); color:#fff; border-color:var(--orange-deep);}
  #twapp button.accent:hover{background:var(--orange-deep);}
  #twapp button.ghost{background:#fff; color:var(--ink);}
  #twapp button.ghost:hover{background:var(--gray-bg);}
  #twapp button:disabled{opacity:.45; cursor:default;}

  #twapp .tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); margin-top:14px; background:#fff;}
  #twapp table{border-collapse:collapse; width:100%; min-width:1040px; font-size:12.4px;}
  #twapp thead th{background:var(--blue-pale); text-align:left; font-size:10.2px; text-transform:uppercase; letter-spacing:.05em; color:var(--blue-deep); padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0;}
  #twapp tbody td{padding:3px 4px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  #twapp tbody tr:hover{background:#FAFBFC;}
  #twapp tbody tr.total-row td, #twapp tbody tr.group-row td{background:var(--blue-pale); font-weight:700; border-top:1px solid var(--blue);}
  #twapp tbody tr.grand-row td{background:var(--ink); color:#fff; font-weight:700;}
  #twapp td input, #twapp td select{width:100%; border:1px solid transparent; background:transparent; padding:5px 3px; font-size:12.2px; border-radius:2px; color:var(--ink); font-family:inherit;}
  #twapp td input:hover, #twapp td select:hover{background:var(--gray-bg);}
  #twapp td input:focus, #twapp td select:focus{outline:none; border:1px solid var(--blue); background:#fff;}
  #twapp td input.num{text-align:right; font-family:'IBM Plex Mono'; width:48px;}
  #twapp td.readonly{color:var(--gray); font-family:'IBM Plex Mono'; padding:5px 5px;}
  #twapp td.readonly.strong{color:var(--ink); font-weight:600;}
  #twapp td select{appearance:auto;}
  #twapp col.c-group{width:118px;} #twapp col.c-purpose{width:130px;} #twapp col.c-detail{width:62px;} #twapp col.c-material{width:130px;}
  #twapp col.c-len{width:66px;} #twapp col.c-sp{width:68px;} #twapp col.c-num{width:44px;}
  #twapp col.c-qty{width:52px;} #twapp col.c-loc{width:68px;} #twapp col.c-price{width:62px;} #twapp col.c-total{width:72px;} #twapp col.c-status{width:92px;} #twapp col.c-del{width:30px;}

  #twapp .status-pill{display:inline-flex; align-items:center; gap:5px; font-size:10.6px; font-weight:600; padding:4px 8px; border-radius:12px; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
  #twapp .status-pending{background:var(--gray-bg); color:var(--gray);}
  #twapp .status-ordered{background:var(--amber-bg); color:var(--amber);}
  #twapp .status-received{background:var(--green-bg); color:var(--green);}
  #twapp .status-pill .sdot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  #twapp .tag-pill{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:9px;}
  #twapp .tag-added{background:var(--green-bg); color:var(--green);}
  #twapp .tag-changed{background:var(--amber-bg); color:var(--amber);}
  #twapp .tag-removed{background:var(--red-bg); color:var(--red);}

  #twapp .delbtn{width:24px;height:24px;border-radius:3px;border:1px solid var(--line);background:#fff;color:#B23A2E;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #twapp .delbtn:hover{background:#FBEAE6;}

  #twapp .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:16px;}
  #twapp .kpi{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden;}
  #twapp .kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--blue);}
  #twapp .kpi.k-orange::before{background:var(--orange);} #twapp .kpi.k-green::before{background:var(--green);} #twapp .kpi.k-amber::before{background:var(--amber);}
  #twapp .kpi .klabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--gray); margin-bottom:6px;}
  #twapp .kpi .kval{font-family:'IBM Plex Mono'; font-size:24px; font-weight:600;}
  #twapp .kpi .ksub{font-size:11px; color:var(--gray); margin-top:2px;}

  #twapp .section-bars{margin-top:22px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  #twapp .sbar-row{display:grid; grid-template-columns:170px 1fr 90px; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:12.3px;}
  #twapp .sbar-row:last-child{border-bottom:none;}
  #twapp .sbar-track{height:9px; background:var(--gray-bg); border-radius:5px; overflow:hidden; display:flex;}
  #twapp .sbar-fill-received{background:var(--green); height:100%;}
  #twapp .sbar-fill-ordered{background:var(--amber); height:100%;}
  #twapp .sbar-amt{font-family:'IBM Plex Mono'; text-align:right; font-size:12px; color:var(--gray);}
  #twapp .legend{display:flex; gap:16px; font-size:11px; color:var(--gray); margin-top:10px;}
  #twapp .legend span{display:inline-flex; align-items:center; gap:5px;}
  #twapp .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

  #twapp .titleblock{margin-top:22px; border:1px solid var(--line); background:#fff; border-radius:var(--radius); padding:16px 18px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 24px;}
  #twapp .titleblock .tb-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--gray); margin-bottom:4px;}
  #twapp .titleblock input{width:100%; border:none; border-bottom:1px solid var(--line); padding:4px 2px; font-size:13.5px; background:transparent; color:var(--ink); font-family:inherit;}
  #twapp .titleblock input:focus{outline:none; border-bottom:1px solid var(--orange);}

  #twapp .empty{padding:34px 12px; text-align:center; color:var(--gray); font-size:13px;}
  #twapp .searchbox{position:relative;}
  #twapp .searchbox input{padding:7px 10px 7px 28px; border:1px solid var(--line); border-radius:var(--radius); font-size:12.5px; width:180px;}
  #twapp .searchbox::before{content:"⌕"; position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--gray); font-size:13px;}

  #twapp .footnote{margin-top:26px; font-size:11px; color:var(--gray); border-top:1px solid var(--line-soft); padding-top:12px; line-height:1.6;}
  #twapp .infobox{margin-top:14px; background:var(--blue-pale); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; font-size:12px; color:var(--blue-deep); line-height:1.55;}
  #twapp .infobox b{color:var(--ink);}

  @media (max-width:820px){
    #twapp .shell{flex-direction:column;}
    #twapp .sidenav{width:100%; position:relative; min-height:auto; display:flex; overflow-x:auto; white-space:nowrap; padding:8px; max-height:none;}
    #twapp .sidenav .grp-label{display:none;}
    #twapp .navitem{border-left:none; border-bottom:3px solid transparent; flex:none;}
    #twapp .navitem.active{border-left:none; border-bottom:3px solid var(--orange);}
    #twapp main{padding:16px 14px 50px;}
    #twapp .topbar{padding:12px 14px;}
  }

  /* ================= HOME / PROJECT PICKER ================= */
  #twapp .homewrap{padding:26px 20px 100px; max-width:820px; margin:0 auto;}
  #twapp .backlink{display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,0.85); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 2px;}
  #twapp .backlink:hover{color:#fff;}
  #twapp .job-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px 18px; margin-top:8px;}
  #twapp .job-cell{display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer;}
  #twapp .job-circle{width:104px; height:104px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; letter-spacing:.02em; text-align:center; padding:6px;
    box-shadow:0 6px 14px rgba(16,35,59,0.28), inset 0 -6px 14px rgba(255,255,255,0.06); border:1px solid var(--blue-deep); transition:transform .12s ease;}
  #twapp .job-cell:hover .job-circle{transform:translateY(-2px); box-shadow:0 10px 18px rgba(16,35,59,0.32);}
  #twapp .job-circle.new{background:transparent; border:2px dashed var(--line); color:var(--orange); font-size:36px; font-weight:400; box-shadow:none;}
  #twapp .job-circle.new:hover{border-color:var(--orange); background:var(--blue-pale);}
  #twapp .job-name{font-size:11.5px; text-align:center; color:var(--ink); font-weight:600; line-height:1.3; max-width:118px;}
  #twapp .job-sub{font-size:10px; color:var(--gray); text-align:center;}

  #twapp .newjob-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:18px; max-width:360px;}
  #twapp .newjob-card label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--gray); margin:10px 0 4px;}
  #twapp .newjob-card label:first-child{margin-top:0;}
  #twapp .newjob-card input{width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:8px 9px; font-size:13.5px; font-family:inherit;}
  #twapp .newjob-card .row{display:flex; gap:10px; margin-top:14px;}

  #twapp .listrow{display:flex; align-items:center; gap:14px; padding:12px 10px; border-bottom:1px solid var(--line-soft); background:#fff; cursor:pointer;}
  #twapp .listrow:hover{background:var(--blue-pale);}
  #twapp .listrow .lr-badge{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:11px;flex:none;}
  #twapp .listrow .lr-main{flex:1; min-width:0;}
  #twapp .listrow .lr-name{font-size:13.5px; font-weight:600;}
  #twapp .listrow .lr-meta{font-size:11px; color:var(--gray); margin-top:1px;}
  #twapp .listrow .lr-arrow{color:var(--gray); font-size:16px;}

  #twapp .cfgrow{display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; margin-bottom:10px;}
  #twapp .cfgrow input{border:1px solid var(--line); border-radius:2px; padding:6px 8px; font-size:12.8px; font-family:inherit;}
  #twapp .cfgrow input.abbr{width:80px; text-transform:uppercase; font-family:'IBM Plex Mono';}
  #twapp .cfgrow input.name{flex:1;}

  #twapp .bottomnav{position:fixed; left:0; right:0; bottom:0; background:var(--ink); border-top:1px solid var(--blue-deep); display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom,0);}
  #twapp .bnav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px; color:rgba(255,255,255,0.55); cursor:pointer; font-size:10.5px; font-weight:600; background:none; border:none;}
  #twapp .bnav-item svg{width:19px;height:19px;}
  #twapp .bnav-item.active{color:#fff;}
  #twapp .bnav-item.active svg{color:var(--orange);}
  #twapp .with-bottomnav{padding-bottom:64px;}
</style>

  </nav>

      var db = findDbEntry(it); var unit = db ? unitPriceOf(db) : null;
      if(!byGroup[g]) byGroup[g] = {};
      if(!byGroup[g][k]) byGroup[g][k] = {material:it.material, length:it.length, species:it.species, qty:0, unit:unit, supply:db?db.supply:null};
      byGroup[g][k].qty += qty;
    });
    return byGroup;
  }
  function aggregateByItemKeyGlobal(){
    var map = {};
    allItemsFlat().forEach(function(it){
      var k = itemKeyOf(it); if(!k) return;
      var qty = computeQty(it); if(!qty) return;
      map[k] = (map[k]||0) + qty;
    });
    return map;
  }

  var auditTimer = null;
  function scheduleAudit(){ if(auditTimer) clearTimeout(auditTimer); auditTimer = setTimeout(runAuditDiff, 1400); }
  function runAuditDiff(){
    var current = aggregateByItemKeyGlobal();
    var prev = state.auditSnapshot || {};
    var diffs = [];
    var now = new Date().toISOString();
    Object.keys(current).forEach(function(k){
      if(!(k in prev)){ diffs.push({ts:now, action:'ADDED', itemKey:k, oldQty:null, newQty:current[k]}); }
      else if(prev[k] !== current[k]){ diffs.push({ts:now, action:'CHANGED', itemKey:k, oldQty:prev[k], newQty:current[k]}); }
    });
    Object.keys(prev).forEach(function(k){
      if(!(k in current)){ diffs.push({ts:now, action:'REMOVED', itemKey:k, oldQty:prev[k], newQty:0}); }
    });
    if(diffs.length){
      state.audit = diffs.concat(state.audit).slice(0, 400);
      state.auditSnapshot = current;
      saveAudit();
      if(state.tab==='audit') renderAudit();
    }
  }

  // ================= AUDIT LOG =================
  function renderAudit(){
    var html = '<div class="pagehead"><div><h2>Audit Log</h2><div class="sub">Histórico automático de alterações de quantidade por ItemKey — como a aba PRICE_AUDIT original.</div></div>' +
      '<div class="actions"><button class="ghost" id="btn-export-audit">Export CSV</button></div></div>';
    html += '<div class="tablewrap"><table style="min-width:0;"><colgroup><col style="width:160px"><col style="width:80px"><col style="width:260px"><col style="width:80px"><col style="width:80px"></colgroup>';
    html += '<thead><tr><th>Timestamp</th><th>Action</th><th>ItemKey</th><th>Old Qty</th><th>New Qty</th></tr></thead><tbody>';
    if(state.audit.length===0){
      html += '<tr><td colspan="5" class="empty">Nenhuma mudança registrada ainda. O log é gerado automaticamente ao adicionar, editar ou remover linhas de takeoff.</td></tr>';
    }
    state.audit.forEach(function(a){
      var cls = a.action==='ADDED'?'tag-added':(a.action==='REMOVED'?'tag-removed':'tag-changed');
      html += '<tr><td class="readonly">'+new Date(a.ts).toLocaleString()+'</td><td><span class="tag-pill '+cls+'">'+a.action+'</span></td>' +
        '<td class="readonly">'+esc(a.itemKey)+'</td><td class="readonly">'+(a.oldQty===null?'—':a.oldQty)+'</td><td class="readonly">'+a.newQty+'</td></tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    document.getElementById('btn-export-audit').addEventListener('click', function(){
      var rows = [['Timestamp','Action','ItemKey','Old Qty','New Qty']];
      state.audit.forEach(function(a){ rows.push([a.ts, a.action, a.itemKey, a.oldQty===null?'':a.oldQty, a.newQty]); });
      downloadCSV((state.project.name||'project')+'-audit-log.csv', rows);
    });
  }

  // ================= SUPPLIERS & TAX =================
  function renderSuppliers(){
    var html = '<div class="pagehead"><div><h2>Suppliers &amp; Tax</h2><div class="sub">Preço final = Preço sem imposto × (1 + Tax% do fornecedor) — igual à aba PRICE original.</div></div>' +
      '<div class="actions"><button class="accent" id="btn-add-sup">+ Add supplier</button></div></div>';
    html += '<div class="tablewrap"><table style="min-width:0;"><colgroup><col style="width:200px"><col style="width:120px"><col style="width:120px"><col style="width:34px"></colgroup>';
    html += '<thead><tr><th>Supply (name)</th><th>Tax %</th><th>Delay (days)</th><th></th></tr></thead><tbody>';
    state.suppliers.forEach(function(s,idx){
      html += '<tr data-idx="'+idx+'"><td><input data-f="name" value="'+esc(s.name)+'"></td>' +
        '<td><input class="num" data-f="tax" type="number" step="0.01" value="'+(s.tax||0)+'"></td>' +
        '<td><input class="num" data-f="delay" type="number" step="1" value="'+(s.delay||0)+'"></td>' +
        '<td><button class="delbtn" data-del="'+idx+'">×</button></td></tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('content').innerHTML = html;
    document.getElementById('btn-add-sup').addEventListener('click', function(){ state.suppliers.push({name:'', tax:0, delay:0}); saveSuppliers(); renderSuppliers(); });
    document.querySelectorAll('#content tbody tr').forEach(function(row){
      row.querySelectorAll('input').forEach(function(inp){
        inp.addEventListener('input', function(){
          var idx = parseInt(row.dataset.idx,10), f = this.dataset.f;
          state.suppliers[idx][f] = (f==='tax'||f==='delay') ? (parseFloat(this.value)||0) : this.value;
          saveSuppliers();
        });
      });
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){ btn.addEventListener('click', function(){ state.suppliers.splice(parseInt(this.dataset.del,10),1); saveSuppliers(); renderSuppliers(); }); });
  }

  // ================= DATABASE =================
  function renderDatabase(){
    var html = '<div class="pagehead"><div><h2>Materials Database</h2><div class="sub">Catálogo Material · Comprimento · Espécie (ItemKey) com preço-base e fornecedor.</div></div>' +
      '<div class="actions"><button class="accent" id="btn-add-db">+ Add material</button></div></div>';
    html += '<div class="tablewrap"><table><colgroup><col style="width:190px"><col style="width:100px"><col style="width:120px"><col style="width:100px"><col style="width:100px"><col style="width:70px"><col style="width:100px"><col style="width:34px"></colgroup>';
    html += '<thead><tr><th>Material</th><th>Length</th><th>Species</th><th>Supply</th><th>Unit $ (no tax)</th><th>Tax%</th><th>Unit $ (final)</th><th></th></tr></thead><tbody>';
    if(state.database.length===0){ html += '<tr><td colspan="8" class="empty">No materials yet.</td></tr>'; }
    state.database.forEach(function(d,idx){
      var unitFinal = unitPriceOf(d);
      html += '<tr data-idx="'+idx+'"><td><input data-f="material" value="'+esc(d.material)+'"></td>' +
        '<td><input data-f="length" value="'+esc(d.length)+'" list="dl-lengths"></td>' +
        '<td><input data-f="species" value="'+esc(d.species)+'" list="dl-species"></td>' +
        '<td><input data-f="supply" value="'+esc(d.supply)+'" list="dl-suppliers"></td>' +
        '<td><input class="num" data-f="unitPriceOutTax" type="number" step="0.01" value="'+(d.unitPriceOutTax||0)+'"></td>' +
        '<td class="readonly">'+taxForSupply(d.supply).toFixed(2)+'</td>' +
        '<td class="readonly strong">'+(unitFinal===null?'—':unitFinal.toFixed(2))+'</td>' +
        '<td><button class="delbtn" data-del="'+idx+'">×</button></td></tr>';
    });
    html += '</tbody></table></div>' + datalists();
    document.getElementById('content').innerHTML = html;
    document.getElementById('btn-add-db').addEventListener('click', function(){
      state.database.push({id:uid(), material:'', length:'', species:'', supply:'FACTORY', unitPriceOutTax:0});
      saveDatabase(); renderDatabase();
    });
    document.querySelectorAll('#content tbody tr').forEach(function(row){
      row.querySelectorAll('input').forEach(function(inp){
        inp.addEventListener('input', function(){
          var idx = parseInt(row.dataset.idx,10), f = this.dataset.f;
          state.database[idx][f] = f==='unitPriceOutTax' ? (parseFloat(this.value)||0) : this.value;
          saveDatabase(); renderDatabase();
        });
      });
    });
    document.querySelectorAll('[data-del]').forEach(function(btn){ btn.addEventListener('click', function(){ state.database.splice(parseInt(this.dataset.del,10),1); saveDatabase(); renderDatabase(); }); });
  }

  function datalists(){
    var h = '<datalist id="dl-lengths">' + LENGTHS.map(function(l){return '<option value="'+esc(l)+'">';}).join('') + '</datalist>';
    h += '<datalist id="dl-species">' + SPECIES.map(function(l){return '<option value="'+esc(l)+'">';}).join('') + '</datalist>';
    h += '<datalist id="dl-locations">' + LOCATIONS.map(function(l){return '<option value="'+esc(l)+'">';}).join('') + '</datalist>';
    h += '<datalist id="dl-spacing">' + SPACINGS.map(function(l){return '<option value="'+esc(l)+'">';}).join('') + '<option value="2 Ply"><option value="3 Ply"></datalist>';
    h += '<datalist id="dl-suppliers">' + state.suppliers.map(function(s){return '<option value="'+esc(s.name)+'">';}).join('') + '</datalist>';
    return h;
  }
  function materialOptionsForSpecies(sp){
    var list = DATEBASE[sp];
    if(!list){
      var key = Object.keys(DATEBASE).find(function(k){ return norm(k)===norm(sp); });
      list = key ? DATEBASE[key] : null;
    }
    return list || [];
  }

  // ================= SECTION TABLES =================
  function renderSection(sid){
    var sec = SECTIONS.find(function(s){return s.id===sid;});
    if(!sec) return renderDashboard();
    var items = state.items[sid] || [];
    var t = sectionTotals(sid);
    var html = '<div class="pagehead"><div><h2>'+esc(sec.label)+'</h2><div class="sub">'+items.length+' line item(s) · estimated '+money(t.total)+'</div></div>' +
      '<div class="actions"><div class="searchbox"><input id="sec-search" placeholder="Filter rows…"></div>' +
      '<button class="ghost" id="btn-export-sec">Export CSV</button><button class="accent" id="btn-add-row">+ Add line</button></div></div>';

    html += '<div class="tablewrap"><table><colgroup>' +
      '<col class="c-group"><col class="c-purpose"><col class="c-detail"><col class="c-material"><col class="c-len"><col class="c-sp">' +
      '<col class="c-num"><col class="c-num"><col class="c-sp"><col class="c-num"><col class="c-qty"><col class="c-loc">' +
      '<col class="c-price"><col class="c-total"><col class="c-status"><col class="c-del">' +
      '</colgroup><thead><tr>' +
      '<th>Group</th><th>Purpose</th><th>Page/Detail</th><th>Material</th><th>Length</th><th>Species</th>' +
      '<th>LF</th><th>SF</th><th>SP</th><th>EA</th><th>QTY</th><th>Location</th>' +
      '<th>Unit $</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="sec-tbody">';

    if(items.length===0){
      html += '<tr><td colspan="16" class="empty">Nenhuma linha ainda. Clique em "+ Add line" para começar o takeoff desta seção.</td></tr>';
    } else {
      items.forEach(function(it, idx){ html += sectionRow(sec, it, idx); });
    }
    html += '<tr class="total-row"><td colspan="13">Section total</td><td class="readonly strong">'+money(t.total)+'</td><td colspan="2"></td></tr>';
    html += '</tbody></table></div>';
    // Per-row Material datalists live here — NOT inside <tr> (a <tr> can only contain <td>/<th>,
    // so a <datalist> placed inside one gets silently relocated by the browser, breaking the
    // species -> material dependent dropdown). Rendering them here keeps a stable, findable DOM node.
    items.forEach(function(it, idx){
      html += '<datalist id="dl-mat-'+sec.id+'-'+idx+'">' + materialOptionsForSpecies(it.species).map(function(m){return '<option value="'+esc(m)+'">';}).join('') + '</datalist>';
    });
    html += '<datalist id="dl-purpose-'+sec.id+'">' + sec.purposes.map(function(p){return '<option value="'+esc(p)+'">';}).join('') + '</datalist>';
    html += datalists();
    document.getElementById('content').innerHTML = html;
    wireSectionEvents(sec);
  }

  function sectionRow(sec, it, idx){
    var qty = computeQty(it);
    var total = lineTotal(it);
    var db = findDbEntry(it);
    var unit = db ? unitPriceOf(db) : null;
    var statusCls = 'status-'+(it.status||'pending');
    var statusLabel = it.status==='received'?'Received':(it.status==='ordered'?'Ordered':'Pending');
    var matDlId = 'dl-mat-'+sec.id+'-'+idx;
    return '<tr data-idx="'+idx+'">' +
      '<td><select data-f="group">'+groupOptions(it.group)+'</select></td>' +
      '<td><input data-f="purpose" list="dl-purpose-'+sec.id+'" value="'+esc(it.purpose)+'"></td>' +
      '<td><input data-f="pageDetail" value="'+esc(it.pageDetail)+'"></td>' +
      '<td><input data-f="material" list="'+matDlId+'" value="'+esc(it.material)+'" placeholder="choose Species first"></td>' +
      '<td><input data-f="length" list="dl-lengths" value="'+esc(it.length)+'"></td>' +
      '<td><input data-f="species" list="dl-species" value="'+esc(it.species)+'"></td>' +
      '<td><input class="num" data-f="lf" type="number" value="'+numOrEmpty(it.lf)+'"></td>' +
      '<td><input class="num" data-f="sf" type="number" value="'+numOrEmpty(it.sf)+'"></td>' +
      '<td><input data-f="sp" list="dl-spacing" value="'+esc(it.sp)+'" placeholder="16 / 2 Ply"></td>' +
      '<td><input class="num" data-f="ea" type="number" value="'+numOrEmpty(it.ea)+'"></td>' +
      '<td class="readonly qty-cell">'+(qty===null?'—':qty)+'</td>' +
      '<td><input data-f="location" list="dl-locations" value="'+esc(it.location)+'"></td>' +
      '<td class="readonly price-cell">'+(unit===null?'—':unit.toFixed(2))+'</td>' +
      '<td class="readonly total-cell">'+(total===null?'—':money(total))+'</td>' +
      '<td><span class="status-pill '+statusCls+'" data-status-toggle><span class="sdot"></span>'+statusLabel+'</span></td>' +
      '<td><button class="delbtn" data-del>×</button></td>' +
      '</tr>';
  }
  function numOrEmpty(v){ return (v===undefined||v===null||v==='') ? '' : v; }

  function wireSectionEvents(sec){
    var tbody = document.getElementById('sec-tbody');
    function refreshRow(idx){
      var it = state.items[sec.id][idx];
      var row = tbody.querySelector('tr[data-idx="'+idx+'"]');
      if(!row) return;
      var qty = computeQty(it), db = findDbEntry(it), unit = db?unitPriceOf(db):null, total = lineTotal(it);
      row.querySelector('.qty-cell').textContent = qty===null?'—':qty;
      row.querySelector('.price-cell').textContent = unit===null?'—':unit.toFixed(2);
      row.querySelector('.total-cell').textContent = total===null?'—':money(total);
      updateHeaderTotal();
    }
    function updateHeaderTotal(){
      var t = sectionTotals(sec.id);
      var sub = document.querySelector('#content .pagehead .sub');
      if(sub) sub.textContent = (state.items[sec.id]||[]).length + ' line item(s) · estimated ' + money(t.total);
      var totRow = tbody.querySelector('.total-row td.readonly');
      if(totRow) totRow.textContent = money(t.total);
      renderNav();
    }
    tbody.querySelectorAll('tr[data-idx]').forEach(function(row){
      var idx = parseInt(row.dataset.idx,10);
      row.querySelectorAll('input,select').forEach(function(inp){
        inp.addEventListener('input', function(){
          var f = this.dataset.f;
          var isNum = ['lf','sf','ea'].indexOf(f)>=0;
          state.items[sec.id][idx][f] = isNum ? (this.value===''?'':parseFloat(this.value)||0) : this.value;
          saveItems(sec.id);
          if(f==='species'){
            var dl = document.getElementById('dl-mat-'+sec.id+'-'+idx);
            if(dl){ dl.innerHTML = materialOptionsForSpecies(this.value).map(function(m){return '<option value="'+esc(m)+'">';}).join(''); }
          }
          refreshRow(idx);
        });
      });
      var pill = row.querySelector('[data-status-toggle]');
      if(pill){
        pill.addEventListener('click', function(){
          var order = ['pending','ordered','received'];
          var cur = state.items[sec.id][idx].status || 'pending';
          state.items[sec.id][idx].status = order[(order.indexOf(cur)+1)%order.length];
          saveItems(sec.id); renderSection(sec.id);
        });
      }
      var delBtn = row.querySelector('[data-del]');
      if(delBtn){ delBtn.addEventListener('click', function(){ state.items[sec.id].splice(idx,1); saveItems(sec.id); renderSection(sec.id); }); }
    });
    document.getElementById('btn-add-row').addEventListener('click', function(){
      var defGroup = DEFAULT_GROUP[sec.id] || '';
      state.items[sec.id].push({id:uid(), group:defGroup, purpose:'', pageDetail:'', material:'', length:'', species:'', lf:'', sf:'', sp:'', ea:'', location:'FACTORY', status:'pending'});
      saveItems(sec.id); renderSection(sec.id);
      setTimeout(function(){
        var rows = document.querySelectorAll('#sec-tbody tr[data-idx]');
        var last = rows[rows.length-1];
        if(last){ var f = last.querySelector('input[data-f="purpose"]'); if(f) f.focus(); }
      },30);
    });
    document.getElementById('btn-export-sec').addEventListener('click', function(){ exportSectionCSV(sec); });
    document.getElementById('sec-search').addEventListener('input', function(){
      var q = norm(this.value);
      tbody.querySelectorAll('tr[data-idx]').forEach(function(row){
        var idx = parseInt(row.dataset.idx,10);
        var it = state.items[sec.id][idx];
        var hay = norm([it.group,it.purpose,it.pageDetail,it.material,it.length,it.species,it.location].join(' '));
        row.style.display = (!q || hay.indexOf(q)>=0) ? '' : 'none';
      });
    });
  }

  // ================= CSV EXPORT =================
  function toCSV(rows){
    return rows.map(function(r){ return r.map(function(c){ var s=(c===undefined||c===null)?'':String(c); if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"'; return s; }).join(','); }).join('\r\n');
  }
  function downloadCSV(filename, rows){
    var csv = toCSV(rows);
    var blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  function exportSectionCSV(sec){
    var rows = [['Group','Purpose','Page/Detail','Material','Length','Species','LF','SF','SP','EA','QTY','Location','ItemKey','Unit Price','Total','Status']];
    (state.items[sec.id]||[]).forEach(function(it){
      var qty=computeQty(it), total=lineTotal(it), db=findDbEntry(it), unit=db?unitPriceOf(db):null;
      rows.push([it.group,it.purpose,it.pageDetail,it.material,it.length,it.species,it.lf,it.sf,it.sp,it.ea, qty===null?'':qty, it.location, displayKeyOf(it), unit===null?'':unit.toFixed(2), total===null?'':total.toFixed(2), it.status||'pending']);
    });
    downloadCSV((state.project.name||'project')+'-'+sec.id+'.csv', rows);
  }
  function exportAllCSV(){
    var rows = [['Section','Group','Purpose','Page/Detail','Material','Length','Species','LF','SF','SP','EA','QTY','Location','ItemKey','Unit Price','Total','Status']];
    SECTIONS.forEach(function(sec){
      (state.items[sec.id]||[]).forEach(function(it){
        var qty=computeQty(it), total=lineTotal(it), db=findDbEntry(it), unit=db?unitPriceOf(db):null;
        rows.push([sec.label,it.group,it.purpose,it.pageDetail,it.material,it.length,it.species,it.lf,it.sf,it.sp,it.ea, qty===null?'':qty, it.location, displayKeyOf(it), unit===null?'':unit.toFixed(2), total===null?'':total.toFixed(2), it.status||'pending']);
      });
    });
    downloadCSV((state.project.name||'project')+'-material-list-full.csv', rows);
  }

  // ================= ROUTER =================
  function renderAll(){
    renderBottomNav();
    if(!state.currentProjectId){
      document.getElementById('shell').style.display = 'none';
      document.getElementById('homecontent').style.display = '';
      document.getElementById('btn-back-home').style.display = 'none';
      if(state.bottomView==='home'){ renderHome(); }
      else if(state.bottomView==='list'){ renderProjectListScreen(); }
      else if(state.bottomView==='config'){ renderConfigScreen(); }
      else { renderMoreScreen(); }
      return;
    }
    // inside a project
    var backLink = document.getElementById('btn-back-home');
    backLink.style.display = '';
    if(state.homeLevel==='project-menu'){
      backLink.textContent = '← All Jobs';
      document.getElementById('shell').style.display = 'none';
      document.getElementById('homecontent').style.display = '';
      document.getElementById('proj-edit').innerHTML = '';
      renderProjectMenu();
      return;
    }
    // shell (a specific tab's content)
    var p = state.projects.find(function(x){ return x.id===state.currentProjectId; });
    backLink.textContent = '← ' + (p?p.name:'Menu');
    document.getElementById('shell').style.display = '';
    document.getElementById('homecontent').style.display = 'none';
    renderNav(); renderProjEdit();
    if(state.tab==='dashboard') renderDashboard();
    else if(state.tab==='ordered') renderOrdered();
    else if(state.tab==='received') renderReceived();
    else if(state.tab==='audit') renderAudit();
    else if(state.tab==='database') renderDatabase();
    else if(state.tab==='suppliers') renderSuppliers();
    else renderSection(state.tab);
  }
  function boot(){
    document.getElementById('homecontent').innerHTML = '<div class="empty" style="padding:80px 0;">Loading…</div>';
    loadProjects().then(function(){
      state.loaded = true;
      renderAll();
    });
  }
  boot();
})();
</script>
